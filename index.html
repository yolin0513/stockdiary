<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#10161f" />
  <!-- 關鍵是 script-src 'self'：只跑本站自己的 JS。就算頁面被注入，也沒有程式碼
       能讀 IndexedDB 把 AI 金鑰送出去。connect-src 只開實際會連的幾個主機。 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://www.twse.com.tw https://api.anthropic.com https://www.cnbc.com https://feeds.content.dowjones.io https://stockdiary-news.yolin0513.workers.dev; object-src 'none'; base-uri 'self'; form-action 'none'" />
  <meta name="description" content="StockDiary 股息日記 — 記錄台股上市持股、每日結算當日損益、累積已領股利、除權息日曆與定期定額。純前端、免註冊、離線可用。不提供投資建議。" />
  <title>StockDiary 股息日記</title>

  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="股息日記" />

  <link rel="stylesheet" href="./css/style.css" />
  <link rel="modulepreload" href="./js/app.js?v=stockdiary-v0.7.2" />
  <link rel="modulepreload" href="./js/router.js" />
  <link rel="modulepreload" href="./js/store.js" />
  <link rel="modulepreload" href="./js/db.js" />
  <link rel="modulepreload" href="./js/ui.js" />
  <link rel="modulepreload" href="./js/shell.js" />
  <link rel="modulepreload" href="./js/prefs.js" />
  <link rel="modulepreload" href="./js/views/home.js?v=stockdiary-v0.7.2" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <button id="backBtn" class="icon-btn" aria-label="返回" hidden>‹</button>
      <h1 id="topTitle">StockDiary</h1>
      <button id="topActionBtn" class="icon-btn" hidden></button>
    </header>

    <main id="view" aria-live="polite"></main>

    <nav id="tabbar" aria-label="主功能列"></nav>
  </div>

  <div id="toast" role="status" hidden></div>
  <div id="modalRoot"></div>

  <noscript>StockDiary 需要啟用 JavaScript 才能執行。</noscript>
  <script type="module" src="./js/app.js?v=stockdiary-v0.7.2"></script>
</body>
</html>
